name: Build Com
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/com/ai app/src/main/res/values
          mv MainActivity.kt ComService.kt Speaker.kt Commands.kt app/src/main/java/com/com/ai/
          mv AndroidManifest.xml app/src/main/
          mv strings.xml app/src/main/res/values/
          mv app-build.gradle.kts app/build.gradle.kts
      - name: Build APK
        run: gradle assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: com-v${{ github.run_number }}
          name: Com v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
